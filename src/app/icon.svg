<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The mark: a frame with its corners intact.
    "Nothing lost" is the entire product, and corner brackets are the one shape
    that reads at 16px as "the edges of a picture are still there".

    Drawn in the site's own palette rather than a flat fill: the iridescent
    sweep across the brackets and the dark sky behind them are what the whole
    site looks like, so a tab, a bookmark and the profile picture all name the
    same thing. No blur filter here, unlike the 1024px profile version — a
    glow turns to mush at 16px, where crisp edges are the only thing that
    survives.
  -->
  <defs>
    <linearGradient id="i" x1="0.06" y1="0" x2="0.94" y2="1">
      <stop offset="0" stop-color="#ff6ad5"/>
      <stop offset="0.34" stop-color="#b06bff"/>
      <stop offset="0.67" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#4ef0ff"/>
    </linearGradient>
    <radialGradient id="s" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0" stop-color="#1a2150"/>
      <stop offset="0.62" stop-color="#0a0c1c"/>
      <stop offset="1" stop-color="#05060c"/>
    </radialGradient>
  </defs>

  <rect width="32" height="32" rx="7.5" fill="url(#s)"/>
  <path d="M8 13V9.4a1.4 1.4 0 0 1 1.4-1.4H13
           M19 8h3.6A1.4 1.4 0 0 1 24 9.4V13
           M24 19v3.6a1.4 1.4 0 0 1-1.4 1.4H19
           M13 24H9.4A1.4 1.4 0 0 1 8 22.6V19"
        fill="none" stroke="url(#i)" stroke-width="2.3" stroke-linecap="round"/>
</svg>
