<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; margin: 0; padding: 14px; background: #12121a; color: #eceef5;
         font: 13px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 14px; margin: 0 0 4px; }
  p  { color: #8b8fa3; font-size: 12px; margin: 0 0 12px; }
  .row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 12.5px; border-top: 1px solid #222230; }
  .row span { color: #8b8fa3; }
  .row b { font-weight: 600; }
  .v { margin-top: 10px; padding: 9px; border-radius: 8px; font-size: 12px; line-height: 1.5;
       background: #1c1c27; border: 1px solid #262633; color: #b9bdcc; }
  .good { background: rgba(53,208,127,.10); border-color: rgba(53,208,127,.35); color: #8ce9b8; }
  .warn { background: rgba(255,176,32,.10); border-color: rgba(255,176,32,.35); color: #ffd489; }
  .bad  { background: rgba(254,44,85,.10);  border-color: rgba(254,44,85,.35);  color: #ff9db1; }
  button { width: 100%; margin-top: 10px; padding: 8px; border-radius: 8px; cursor: pointer;
           background: #1c1c27; border: 1px solid #2f2f3f; color: #eceef5; font: inherit; font-size: 12.5px; }
  button:hover { background: #242430; }
</style>
</head>
<body>
  <h1>TikTok Upload Inspector</h1>
  <p>Open a TikTok upload page to measure.</p>
  <div class="row"><span>Source</span><b id="file">—</b></div>
  <div class="row"><span>Sent</span><b id="sent">—</b></div>
  <div class="row"><span>Guard mode</span><b id="guard">—</b></div>
  <div class="v" id="verdict">No data yet.</div>
  <button id="reset">Reset measurement</button>
<script src="popup.js"></script>
</body>
</html>
