# Is the live site still working?
#
# Runs the checks that need nothing but HTTP: the site responds, the paywall
# holds, the webhook secret is configured, and checkout still reaches Stripe.
#
# NOT run here: the byte-equality anchors, which need reference media that is
# deliberately not in the repo, and the staleness nag, which needs the database.
# Both are skipped explicitly rather than allowed to pass vacuously — a canary
# that reports green having checked nothing is worse than no canary.
#
# No secrets are needed, which is the point: a production connection string on a
# build runner would be a worse risk than the failures this catches.

name: canary

# THE SCHEDULE LIVES ON RAILWAY NOW — see docs/canary-on-railway.md.
#
# Actions billing was blocked on the account, so the scheduled run stopped
# starting. A canary that has quietly stopped is worse than no canary, because
# you go on trusting it, so the schedule was moved rather than left to fail into
# an inbox nobody reads. Railway also has the database, which this runner
# deliberately does not, so the staleness nag works there and never could here.
#
# Kept as a manual trigger: if Actions billing is ever sorted out, this is a
# second opinion from outside Railway's network, which is worth having.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: canary
        env:
          CANARY_ORIGIN: https://pristine4k.com
        run: npm run canary -- --http-only
