name: Publish static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run verify
      - run: npm run build
        env:
          GITHUB_PAGES: ${{ vars.CUSTOM_DOMAIN == '' && '1' || '0' }}
          NEXT_PUBLIC_BUY_ME_A_COFFEE_URL: ${{ vars.BUY_ME_A_COFFEE_URL }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
